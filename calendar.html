<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("site_theme")||"dark";document.documentElement.className="theme-"+t;var bg={dark:"#121212",monet:"#0d0703",light:"#f7f4ef",pink:"#fff0f5"}[t];var m=document.querySelector('meta[name="theme-color"]');if(m&&bg)m.setAttribute("content",bg);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title data-i18n="cal_title">Календарь</title>
<link rel="preconnect" href="https://haxmgtflegsfpxieaydv.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
    <h1 data-i18n="cal_h1">🗓️ Календарь</h1>
    <p class="dim" data-i18n="cal_intro">Кликни на день, чтобы записать план — сразу попадёт в "Что полезного сделал"
    этого дня на дашборде, когда он наступит (или уже отмечено, если день прошёл).</p>

    <div class="day-nav">
        <button class="secondary" id="prev-month" data-i18n="cal_prev_month">← Пред.</button>
        <strong id="month-label"></strong>
        <button class="secondary" id="today-month" data-i18n="today_btn">Сегодня</button>
        <button class="secondary" id="next-month" data-i18n="cal_next_month">След. →</button>
    </div>

    <div id="calendar-grid" class="calendar-grid" data-i18n="loading_ellipsis">Загрузка…</div>
</main>
<script defer src="i18n.js"></script>
<script defer src="theme.js"></script>
<script defer src="config.js"></script>
<script defer src="calendar.js"></script>
</body>
</html>
