<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("site_theme")||"dark";document.documentElement.className="theme-"+t;var bg={dark:"#121212",monet:"#0d0703",light:"#f7f4ef",pink:"#fff0f5"}[t];var m=document.querySelector('meta[name="theme-color"]');if(m&&bg)m.setAttribute("content",bg);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title data-i18n="acc_title">Аккаунт</title>
<link rel="preconnect" href="https://haxmgtflegsfpxieaydv.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
    <h1 data-i18n="acc_h1">👤 Аккаунт</h1>

    <div class="card">
        <h3 style="margin-top:0;" data-i18n="acc_change_password_h3">🔑 Сменить пароль</h3>
        <label>
            <span data-i18n="acc_new_password_label">Новый пароль</span>
            <input type="password" id="new-password" style="width:100%; margin-top:4px;">
        </label>
        <label style="display:block; margin-top:12px;">
            <span data-i18n="acc_confirm_password_label">Повтори новый пароль</span>
            <input type="password" id="confirm-password" style="width:100%; margin-top:4px;">
        </label>
        <button id="change-password-btn" style="margin-top:16px;" data-i18n="acc_change_password_btn">Сменить пароль</button>
        <p id="password-msg" class="dim" style="margin-top:10px; font-size:0.9em;"></p>
    </div>

    <div class="card">
        <h3 style="margin-top:0;" data-i18n="acc_change_email_h3">✉️ Сменить почту</h3>
        <p class="dim" style="font-size:0.9em; margin-bottom:12px;">
            <span data-i18n="acc_current_email_label">Текущая почта</span>: <span id="current-email"></span>
        </p>
        <label>
            <span data-i18n="acc_new_email_label">Новая почта</span>
            <input type="email" id="new-email" style="width:100%; margin-top:4px;">
        </label>
        <button id="change-email-btn" style="margin-top:16px;" data-i18n="acc_change_email_btn">Сменить почту</button>
        <p id="email-msg" class="dim" style="margin-top:10px; font-size:0.9em;"></p>
    </div>

    <div class="card">
        <h3 style="margin-top:0;" data-i18n="acc_google_h3">🔗 Google-аккаунт</h3>
        <p id="google-link-status" class="dim" style="font-size:0.9em; margin-bottom:12px;"></p>
        <button id="link-google-btn" data-i18n="acc_link_google_btn" style="display:none;">Привязать Google</button>
    </div>
</main>
<script defer src="i18n.js"></script>
<script defer src="theme.js"></script>
<script defer src="config.js"></script>
<script defer src="account.js"></script>
</body>
</html>
