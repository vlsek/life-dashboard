<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Тот же приём, что и на остальных страницах сайта: класс темы и цвет строки состояния
         ставятся синхронно, до первой отрисовки, чтобы не мелькал неверный цвет (см. v0.60). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('site_theme') || 'dark'
          document.documentElement.className = 'theme-' + t
          var bg = { dark: '#121212', monet: '#0d0703', light: '#f7f4ef', pink: '#fff0f5' }[t]
          // цвет огонька заставки по теме (акценты из style.css; CSS-переменных бандла ещё нет)
          var ac = { dark: '#5b8def', monet: '#f2a93c', light: '#d97f2a', pink: '#ff4f81' }[t]
          if (bg) document.documentElement.style.setProperty('--pre-bg', bg)
          if (ac) document.documentElement.style.setProperty('--pre-accent', ac)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m && bg) m.setAttribute('content', bg)
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/favicon.svg" />
    <title>Дашборд (пилот на Vue)</title>
    <style>html{background:var(--pre-bg,#121212)}.pre-splash{justify-content:center;align-items:center;min-height:60vh;display:flex}.pre-splash svg{transform-origin:50% 90%;filter:drop-shadow(0 0 8px var(--pre-accent,#5b8def));animation:1.8s ease-in-out infinite pre-flicker}.pre-splash .o{fill:var(--pre-accent,#5b8def)}.pre-splash .i{fill:color-mix(in srgb, var(--pre-accent,#5b8def) 40%, #fff)}@keyframes pre-flicker{0%,to{transform:scale(1)rotate(0)}25%{transform:scale(1.05,.97)rotate(-1.5deg)}55%{transform:scale(.97,1.05)rotate(1.2deg)}80%{transform:scaleX(1.03)rotate(-.6deg)}}@media (prefers-reduced-motion:reduce){.pre-splash svg{animation:none}}</style>
    <script type="module" crossorigin src="/dashboard/assets/index-RBWInz9f.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/index-DbFOmaZR.css">
  </head>
  <body>
    <div id="app">
