<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Тот же приём, что и на остальных страницах сайта: класс темы и цвет строки состояния
         ставятся синхронно, до первой отрисовки, чтобы не мелькал неверный цвет (см. v0.60). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('site_theme') || 'dark'
          document.documentElement.className = 'theme-' + t
          var bg = { dark: '#121212', monet: '#0d0703', light: '#f7f4ef', pink: '#fff0f5', mint: '#effaf4', sepia: '#f4ecd8', solarlight: '#fdf6e3', nord: '#2e3440', mocha: '#1e1e2e', amoled: '#000000', contrast: '#000000' }[t]
          // цвет огонька заставки по теме (акценты из style.css; CSS-переменных бандла ещё нет)
          var ac = { dark: '#5b8def', monet: '#f2a93c', light: '#d97f2a', pink: '#ff4f81', mint: '#13805a', sepia: '#9a5b13', solarlight: '#1d6fa8', nord: '#88c0d0', mocha: '#cba6f7', amoled: '#4ea1ff', contrast: '#ffd60a' }[t]
          if (bg) document.documentElement.style.setProperty('--pre-bg', bg)
          if (ac) document.documentElement.style.setProperty('--pre-accent', ac)
          // вариант заставки (та же логика, что readSplashVariant в src/lib/splashVariants.ts):
          // ?splash= в адресе → localStorage → 'flame' по умолчанию
          var sv = ['classic', 'flame', 'ring']
          var q = new URLSearchParams(location.search).get('splash')
          var sp = sv.indexOf(q) >= 0 ? q : localStorage.getItem('splash_variant')
          document.documentElement.setAttribute('data-splash', sv.indexOf(sp) >= 0 ? sp : 'flame')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m && bg) m.setAttribute('content', bg)
        } catch (e) {}
      })()
    </script>
    <script>
      // выключатель «отключить все анимации» (BACKLOG 16, 14:02): флаг на <html> до первой отрисовки,
      // чтобы вся страница уважала выбор человека с первого кадра (правило — в src/style.css)
      try {
        if (localStorage.getItem('site_motion') === 'off') document.documentElement.setAttribute('data-motion', 'off')
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Dashboard" />
    <title>Навыки (пилот на Vue)</title>
    <style>
      /* Заставка до загрузки бандла: Vue заменяет содержимое #app при монтировании. Без CSS
         бандла — свои стили и цвета темы из скрипта выше; в SplashLoader.vue та же разметка. */
      /* Фон html: до загрузки бандла --bg ещё нет — берём цвет темы из скрипта (--pre-bg); после загрузки
         html.theme-* задаёт --bg и фон следует за ТЕКУЩЕЙ темой (BACKLOG 18, 🐞 «пропадает фон внизу экрана
         при прокрутке»: раньше здесь был фиксированный --pre-bg, и после смены темы без перезагрузки область
         ниже первого экрана оставалась цвета прежней темы — фон html, в отличие от body, не обновлялся). */
      html { background: var(--bg, var(--pre-bg, #121212)); }
      .pre-splash { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
      .pre-splash svg { display: none; overflow: visible; filter: drop-shadow(0 0 8px var(--pre-accent, #5b8def)); }
      .pre-splash .pre-flame { display: block; }
      html[data-splash='classic'] .pre-splash .pre-flame, html[data-splash='ring'] .pre-splash .pre-flame { display: none; }
      html[data-splash='classic'] .pre-splash .pre-classic, html[data-splash='ring'] .pre-splash .pre-ring { display: block; }
      .pre-classic { animation: pre-flicker 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
      .pre-classic .o { fill: var(--pre-accent, #5b8def); }
      .pre-classic .i { fill: color-mix(in srgb, var(--pre-accent, #5b8def) 40%, #fff); }
      .pre-live .tg { transform-box: fill-box; transform-origin: 50% 100%; }
      .pre-live .tc { fill: var(--pre-accent, #5b8def); animation: pre-tc 1.3s ease-in-out infinite; }
      .pre-live .tl { fill: color-mix(in srgb, var(--pre-accent, #5b8def) 78%, transparent); animation: pre-tl 0.95s ease-in-out -0.3s infinite; }
      .pre-live .tr { fill: color-mix(in srgb, var(--pre-accent, #5b8def) 78%, transparent); animation: pre-tr 1.15s ease-in-out -0.7s infinite; }
      .pre-live .tk { fill: color-mix(in srgb, var(--pre-accent, #5b8def) 35%, #fff); animation: pre-tk 0.8s ease-in-out -0.2s infinite; }
      .pre-live .sp { fill: color-mix(in srgb, var(--pre-accent, #5b8def) 45%, #fff); opacity: 0; animation: pre-sp var(--d, 2s) ease-out var(--o, 0s) infinite; }
      .pre-ring .rb, .pre-ring .ri, .pre-ring .ra { fill: none; stroke: var(--pre-accent, #5b8def); stroke-linecap: round; }
      .pre-ring .rb { stroke-opacity: 0.16; stroke-width: 5; }
      .pre-ring .rs, .pre-ring .ri { transform-box: view-box; transform-origin: 50% 50%; }
      .pre-ring .rs { animation: pre-spin 1.2s linear infinite; }
      .pre-ring .at { stroke-width: 5; stroke-opacity: 0.3; stroke-dasharray: 78 110.5; }
      .pre-ring .am { stroke-width: 6; stroke-opacity: 0.65; stroke-dasharray: 52 136.5; stroke-dashoffset: -26; }
      .pre-ring .ah { stroke-width: 7; stroke: color-mix(in srgb, var(--pre-accent, #5b8def) 55%, #fff); stroke-dasharray: 24 164.5; stroke-dashoffset: -54; }
      .pre-ring .ri { stroke-opacity: 0.55; stroke-width: 2; stroke-dasharray: 30 108.2; animation: pre-spin 2.2s linear infinite reverse; }
      .pre-ring .rf { transform-box: fill-box; transform-origin: 50% 90%; animation: pre-flicker 1.8s ease-in-out infinite; }
      .pre-ring .o { fill: var(--pre-accent, #5b8def); }
      .pre-ring .i { fill: color-mix(in srgb, var(--pre-accent, #5b8def) 40%, #fff); }
      @keyframes pre-flicker {
        0%, 100% { transform: scale(1, 1) rotate(0deg); }
        25% { transform: scale(1.05, 0.97) rotate(-1.5deg); }
        55% { transform: scale(0.97, 1.05) rotate(1.2deg); }
        80% { transform: scale(1.03, 1) rotate(-0.6deg); }
      }
      @keyframes pre-tc { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 30% { transform: scale(0.96, 1.08) skewX(-4deg); } 65% { transform: scale(1.03, 0.95) skewX(3deg); } }
      @keyframes pre-tl { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 40% { transform: scale(0.9, 1.15) skewX(-7deg); } 75% { transform: scale(1.05, 0.9) skewX(4deg); } }
      @keyframes pre-tr { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 35% { transform: scale(0.92, 1.12) skewX(6deg); } 70% { transform: scale(1.06, 0.92) skewX(-4deg); } }
      @keyframes pre-tk { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(0.88, 1.12); } }
      @keyframes pre-sp { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 0), -22px) scale(0.3); opacity: 0; } }
      @keyframes pre-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .pre-splash svg, .pre-splash svg * { animation: none !important; } }
      html[data-motion='off'] .pre-splash svg, html[data-motion='off'] .pre-splash svg * { animation: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="pre-splash" aria-hidden="true">
        <svg class="pre-flame pre-live" viewBox="0 0 64 64" width="80" height="80">
          <path class="tg tl" d="M17 22C20 31 11 36 11 44C11 52 18 57 25 57C18 52 22 44 24 38C21 33 18 29 17 22Z" />
          <path class="tg tr" d="M47 22C44 31 53 36 53 44C53 52 46 57 39 57C46 52 42 44 40 38C43 33 46 29 47 22Z" />
          <path class="tg tc" d="M32 3C34 13 46 21 46 37C46 49 40 58 32 58C24 58 18 49 18 37C18 29 24 25 26 17C28 21 30 21 31 15C31.5 10 31.8 7 32 3Z" />
          <path class="tg tk" d="M32 30C33 36 40 40 40 47C40 53 36 58 32 58C28 58 24 53 24 47C24 40 31 36 32 30Z" />
          <circle class="sp" cx="25" cy="14" r="1.3" style="--dx: -5px; --d: 2.1s; --o: 0s" />
          <circle class="sp" cx="34" cy="10" r="1.1" style="--dx: 3px; --d: 1.7s; --o: -0.6s" />
          <circle class="sp" cx="41" cy="16" r="1.4" style="--dx: 6px; --d: 2.4s; --o: -1.2s" />
          <circle class="sp" cx="30" cy="12" r="0.9" style="--dx: -2px; --d: 1.9s; --o: -1.7s" />

        <svg class="pre-ring" viewBox="0 0 80 80" width="88" height="88">

            <circle class="ra at" cx="40" cy="40" r="30" />
            <circle class="ra am" cx="40" cy="40" r="30" />
            <circle class="ra ah" cx="40" cy="40" r="30" />
          </g>
          <circle class="ri" cx="40" cy="40" r="22" />
          <g class="rf" transform="translate(40 41) scale(0.5) translate(-16 -16) translate(3.3 0.7)">
            <path class="o" d="M16.5 0.5c1.2 5.3-3.2 6.8-3.5 11a3.2 3.2 0 0 0 6.4 0.2c2.1 1.1 3.1 4.3 3.1 7.5a9.5 10.5 0 1 1-19.5 0.3c-0.1-6.4 4.2-9.7 6.3-14 1.1-2.2 2.1-3.5 7.2-5z" />
            <path class="i" d="M16.3 11.2c.6 3.2-1.6 3.8-1.6 6a1.6 1.6 0 0 0 3.2 0c1.1 3.2-.5 7-3.7 7a5.3 5.3 0 0 1-5.3-5.4c0-3.7 3.2-5.3 5.3-9 .4-.7.9-1.3 2.1-2.6z" />
          </g>
        </svg>
        <svg class="pre-classic" viewBox="0 0 32 32" width="72" height="72">
          <g transform="translate(16 16) scale(1.04) translate(-16 -16) translate(3.3 0.7)">
            <path class="o" d="M16.5 0.5c1.2 5.3-3.2 6.8-3.5 11a3.2 3.2 0 0 0 6.4 0.2c2.1 1.1 3.1 4.3 3.1 7.5a9.5 10.5 0 1 1-19.5 0.3c-0.1-6.4 4.2-9.7 6.3-14 1.1-2.2 2.1-3.5 7.2-5z" />
            <path class="i" d="M16.3 11.2c.6 3.2-1.6 3.8-1.6 6a1.6 1.6 0 0 0 3.2 0c1.1 3.2-.5 7-3.7 7a5.3 5.3 0 0 1-5.3-5.4c0-3.7 3.2-5.3 5.3-9 .4-.7.9-1.3 2.1-2.6z" />
          </g>
        </svg>
      </div>
    </div>
    <!-- splash-hold:start (BACKLOG «Огонёк пропадает, а страница ещё не загрузилась»; ответ владельца 2026-10-04: держать заставку, пока страница не загрузится ЦЕЛИКОМ).
     Канонический текст — scripts/splash-hold.snippet.html; в страницы его кладёт scripts/apply_splash_hold.py, руками не править. -->
    <style>
      .pre-overlay { position: fixed; inset: 0; z-index: 2147483000; min-height: 0; background: var(--bg, var(--pre-bg, #121212)); transition: opacity 0.25s ease; }
      .pre-overlay.pre-out { opacity: 0; pointer-events: none; }
      html[data-motion='off'] .pre-overlay { transition: none; }
    </style>
    <script>
      // Статичная заставка внутри #app пропадает в момент монтирования Vue — раньше, чем придут данные, и блоки
      // «выползают» по одному. Поэтому ставим её копию поверх страницы и снимаем, когда страница готова целиком:
      // смонтирована, документ загружен (readyState=complete), нет незавершённых fetch и 500 мс тишины. Страховка — 8 с.
      ;(function () {
        var pre = document.querySelector('.pre-splash')
        if (!pre || !document.body) return
        var ov = pre.cloneNode(true)
        ov.className = 'pre-splash pre-overlay'
        ov.setAttribute('aria-hidden', 'true')
        ov.setAttribute('data-test', 'pre-overlay')
        document.body.appendChild(ov)

        var QUIET_MS = 500
        var MAX_MS = 8000
        var started = Date.now()
        var pending = 0
        var quietFrom = 0
        var nativeFetch = window.fetch
        var wrapped = null
        if (typeof nativeFetch === 'function') {
          wrapped = function () {
            pending++
            var p = nativeFetch.apply(this, arguments)
            var fin = function () {
              pending = Math.max(0, pending - 1)
              quietFrom = Date.now()
            }
            p.then(fin, fin)
            return p
          }
          window.fetch = wrapped
        }

        var timer = setInterval(function () {
          var now = Date.now()
          var mounted = !document.querySelector('#app .pre-splash')
          if (mounted && !quietFrom) quietFrom = now
          var ready = mounted && document.readyState === 'complete' && pending === 0 && now - quietFrom >= QUIET_MS
          if (ready || now - started >= MAX_MS) finish()
        }, 100)

        function finish() {
          clearInterval(timer)
          if (wrapped && window.fetch === wrapped) window.fetch = nativeFetch
          var off = document.documentElement.getAttribute('data-motion') === 'off'
          ov.classList.add('pre-out')
          setTimeout(function () {
            if (ov.parentNode) ov.parentNode.removeChild(ov)
          }, off ? 0 : 300)
        }
      })()
    </script>
    <!-- splash-hold:end -->
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Глобальный хедер (стакан воды и кольца дня/недели, BACKLOG 2.3) — отдельный бандл web-header/ → /header-widgets/.
      // Подключаем не через <script src>, чтобы Vite не пытался собрать его в бандл этой страницы.
      ;(function () {
        var s = document.createElement('script')
        s.type = 'module'
        s.src = '/header-widgets/header.js'
        document.body.appendChild(s)
      })()
    </script>
  </body>
</html>
