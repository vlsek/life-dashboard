<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("site_theme")||"dark";document.documentElement.className="theme-"+t;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Log in — Personal Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="centered-body">
<main class="auth-main">
    <div id="lang-switch-slot" style="display:flex; justify-content:center; margin-bottom:14px;"></div>
    <h1 data-i18n="login_title">🔐 Personal Dashboard</h1>
    <div class="card" style="max-width:360px;">
        <div class="tabs">
            <button id="tab-login" class="tab active" data-i18n="tab_login">Log in</button>
            <button id="tab-register" class="tab" data-i18n="tab_register">Sign up</button>
        </div>
        <div id="form-area"></div>
        <div class="auth-divider"><span data-i18n="login_or_divider">or</span></div>
        <button id="google-signin-btn" class="secondary" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px;">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.87 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.6 8.6 0 0 0 9 0 9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
            </svg>
            <span data-i18n="login_google_btn">Continue with Google</span>
        </button>
        <p id="msg" class="dim" style="margin-top:10px;"></p>
    </div>
    <p class="dim" style="margin-top:20px;"><a href="https://portfolio.orneryhero.workers.dev/" data-i18n="back_to_portfolio">← Back to portfolio</a></p>
</main>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
