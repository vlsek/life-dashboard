    <!-- Тот же приём, что и на остальных страницах сайта: класс темы и цвет строки состояния
         ставятся синхронно, до первой отрисовки, чтобы не мелькал неверный цвет (см. v0.60). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('site_theme') || 'dark'
          document.documentElement.className = 'theme-' + t
          var bg = { dark: '#121212', monet: '#0d0703', light: '#f7f4ef', pink: '#fff0f5' }[t]
          // цвет огонька заставки по теме (акценты из style.css; CSS-переменных бандла ещё нет)
          var ac = { dark: '#5b8def', monet: '#f2a93c', light: '#d97f2a', pink: '#ff4f81' }[t]
          if (bg) document.documentElement.style.setProperty('--pre-bg', bg)
          if (ac) document.documentElement.style.setProperty('--pre-accent', ac)
          // вариант заставки (та же логика, что readSplashVariant в src/lib/splashVariants.ts):
          // ?splash= в адресе → localStorage → 'flame' по умолчанию
          var sv = ['classic', 'flame', 'ring']
          var q = new URLSearchParams(location.search).get('splash')
          var sp = sv.indexOf(q) >= 0 ? q : localStorage.getItem('splash_variant')
          document.documentElement.setAttribute('data-splash', sv.indexOf(sp) >= 0 ? sp : 'flame')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m && bg) m.setAttribute('content', bg)
        } catch (e) {}
      })()
    </script>
    <script>
      // выключатель «отключить все анимации» (BACKLOG 16, 14:02): флаг на <html> до первой отрисовки,
      // чтобы вся страница уважала выбор человека с первого кадра (правило — в src/style.css)
      try {
        if (localStorage.getItem('site_motion') === 'off') document.documentElement.setAttribute('data-motion', 'off')
      } catch (e) {}
    </script>
