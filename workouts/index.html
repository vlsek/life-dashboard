<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('site_theme') || 'dark'
          document.documentElement.className = 'theme-' + t
          var bg = { dark: '#121212', monet: '#0d0703', light: '#f7f4ef', pink: '#fff0f5' }[t]
          var m = document.querySelector('meta[name="theme-color"]')
          if (m && bg) m.setAttribute('content', bg)
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/workouts/favicon.svg" />
    <title>Тренировки (пилот на Vue)</title>
    <script type="module" crossorigin src="/workouts/assets/index-Dq_U75Mx.js"></script>
    <link rel="stylesheet" crossorigin href="/workouts/assets/index-DyWJUxEi.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Глобальный хедер (стакан воды и кольца дня/недели, BACKLOG 2.3) — отдельный бандл web-header/ → /header-widgets/.
      // Подключаем не через <script src>, чтобы Vite не пытался собрать его в бандл этой страницы.
      ;(function () {
        var s = document.createElement('script')
        s.type = 'module'
        s.src = '/header-widgets/header.js'
        document.body.appendChild(s)
      })()
    </script>
  </body>
</html>
